# AI Nexus 一键部署：MySQL + Qdrant + Ollama + 后端 + 前端
# 启动：docker compose up -d --build
# 首次启动后访问 http://localhost:8080，注册账号并在"模型设置"中配置聊天模型供应商
# 敏感配置通过根目录 .env 覆盖：MYSQL_ROOT_PASSWORD、JWT_SECRET
name: ai-nexus

services:
  mysql:
    image: mysql:8.0
    container_name: ai-nexus-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ai_nexus_2024}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # init.sql 自带 CREATE DATABASE，首次启动自动完成全量建表
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: ai-nexus-qdrant
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      # 控制台面板便于排查向量问题；与本机已有 Qdrant 冲突时删除此映射
      - "6333:6333"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.11.4
    container_name: ai-nexus-ollama
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # 一次性任务：拉取默认 Embedding 模型 bge-m3（约 1.2GB）
  # 拉取期间后端已可启动；文件处理失败会按内置策略自动重试
  ollama-init:
    image: ollama/ollama:0.11.4
    container_name: ai-nexus-ollama-init
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 2; done; until ollama pull bge-m3; do sleep 5; done"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  rag-server:
    build:
      context: ./rag-server
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-}
    container_name: ai-nexus-server
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/rag_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ai_nexus_2024}
      QDRANT_HOST: qdrant
      EMBEDDING_API_URL: http://ollama:11434/api/embeddings
      EMBEDDING_MODEL: bge-m3
      FILE_UPLOAD_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:-ai-nexus-compose-jwt-secret-please-change-me}
    volumes:
      - ./uploads:/data/uploads
    ports:
      # 直接访问后端 API 用于调试；前端统一走 nginx 反代
      - "8888:8888"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  rag-web:
    build:
      context: ./rag-web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: ai-nexus-web
    ports:
      - "8080:80"
    depends_on:
      - rag-server
    restart: unless-stopped

volumes:
  mysql-data:
  qdrant-data:
  ollama-models:
