<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI Nexus · 登录（深空纸面样机）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login">
  <div class="logo">AI <span>Nexus</span></div>
  <h1>登录</h1>
  <div class="sub">把企业文档，变成可追问的知识</div>
  <form>
    <div class="field">
      <label>用户名</label>
      <input type="text" placeholder="请输入用户名">
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" placeholder="请输入密码">
    </div>
    <div class="aux">
      <label><input type="checkbox" checked> 记住我</label>
      <a href="#">忘记密码？</a>
    </div>
    <button class="btn-primary" type="button">登 录</button>
    <div class="aux" style="justify-content:center; margin-bottom:0;">
      还没有账号？ <a href="#">注册</a>
    </div>
  </form>
  <div class="foot">AI Nexus 企业级 AI 平台 · v3.0 深空纸面样机</div>
</div>
</body>
</html>
